<!-- Composed, see media-mark-audio.svg: the same square frame with the picture
     of imagesmode inside it. imagesmode is drawn on a 720 grid while the other
     three marks are 840, so as a plain download it stood visibly smaller than
     its neighbours in the column. Taking its FRAME and scaling it up would have thickened its
     stroke by the same 17 % — so the frame comes from font_download like the
     others and only the picture inside is scaled (680/560), which leaves every
     stroke in the family identical. imagesmode itself stays untouched: Canvas
     hangs it on its image node. -->
<svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#e3e3e3"><path d="M140-80q-24 0-42-18t-18-42v-680q0-24 18-42t42-18h680q24 0 42 18t18 42v680q0 24-18 42t-42 18H140Zm1-60h680v-680H141v680Zm0-680v680-680Z"/><g transform="translate(480 -480) scale(1.214) translate(-480 480)"><path d="M240-280h480L570-480 450-320l-90-120-120 160Z"/><path d="M340-560q25 0 42.5-17.5T400-620q0-25-17.5-42.5T340-680q-25 0-42.5 17.5T280-620q0 25 17.5 42.5T340-560Z"/></g></svg>
