<!-- Composed, see media-mark-audio.svg: the square frame of font_download with
     a mouth inside it. DRAWN, not a download: Material Symbols has no mouth
     glyph. Two shapes: an upper lip whose cupid's bow is what makes it read
     as a mouth and not as an eye, and a fuller lower lip; the gap between them
     is the opening. Scaled 1.2 so it fills the square like the note does.
     What stood here before was voice_selection — a hand with sound waves, the
     one mark in the set that was not a thing inside a frame. -->
